- insert:
    - id: dsh-codex-exec
      name: 'dsh-codex-exec'
      config:
        # Discovery order: this value (if an absolute .exe) → npm global vendor
        # dir → Codex Desktop's versioned bin dir → PATH. Keep it as a bare
        # command so the plugin probes the machine instead of hardcoding a path
        # that breaks after an upgrade.
        codexCommand: 'codex'
        sandbox: workspace-write
        # 0 = no cap: a Codex run that is still working is never killed. A
        # positive value arms both the host deadline and the plugin's own kill.
        timeoutMs: 0
        # Per-session defaults; each DSH session keeps its own selector state and
        # each call may override model/effort/role.
        defaultModel: 'gpt-6-luna'
        defaultEffort: 'medium'
        defaultRole: 'executor'
